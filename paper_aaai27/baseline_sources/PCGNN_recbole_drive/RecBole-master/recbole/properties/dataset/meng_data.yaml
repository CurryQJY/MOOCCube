# Atomic File Format
field_separator: "\t"
seq_separator: " "

# Common Features
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
seq_len: ~
# Label for Point-wise DataLoader
LABEL_FIELD: label
#一般在context-aware模型才启用：因为数据集没有标签，所以设置一个阈值，认为rating高于该值的是正例，反之是负例
#threshold:
#    rating: 4
# NegSample Prefix for Pair-wise DataLoader
NEG_PREFIX: neg_
# Sequential Model Needed
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id
# Knowledge-based Model Needed
HEAD_ENTITY_ID_FIELD: head_id
TAIL_ENTITY_ID_FIELD: tail_id
RELATION_ID_FIELD: relation_id
ENTITY_ID_FIELD: entity_id

# Selectively Loading
load_col:
    inter: [user_id, item_id, rating]
#    item: [item_id, first_level_category, second_level_category]
    kg: [ 'head_id', 'relation_id', 'tail_id' ]
    link: [ 'item_id', 'entity_id' ]
#    inter: [user_id, item_id, rating]
unload_col: ~
unused_col: ~

# Filtering
rm_dup_inter: ~
lowest_val: ~
highest_val: ~
equal_val: ~
not_equal_val: ~
filter_inter_by_user_or_item: True
max_user_inter_num: ~
min_user_inter_num: ~
max_item_inter_num: ~
min_item_inter_num: ~

# Preprocessing
fields_in_same_space: ~
preload_weight: ~
normalize_field: ~
normalize_all: True

#epochs: 5
epochs: 25
#eval_setting: RO_LS,uni100

eval_setting: RO_RS,full
group_by_user: True
split_ratio: [0.8,0.1,0.1]
leave_one_num: 2
#topk: [3,5,10]
topk: [5,10,15,20]
train_batch_size: 1024
training_neg_sample_num: 1
#learning_rate: 0.01
learning_rate: 0.001
metrics: ["Recall", "MRR","NDCG","Hit","Precision"]
use_node2vec_pretrain: False