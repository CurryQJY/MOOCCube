# ================= 数据路径 =================
data_path: ./dataset/
dataset: MOOCCubeX_Paper   # ⚠️ 必须对应您预处理生成的文件夹名
field_separator: "\t"
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
# MF 不需要时间戳

# ================= 数据加载 =================
load_col:
    inter: [user_id, item_id]

# ================= 过滤设置 =================
# ⚠️ 关键：数据已预处理，设为 0 防止二次过滤
user_inter_num_interval: "[0,inf)"
item_inter_num_interval: "[0,inf)"

# ================= MF (BPR) 模型参数 =================
embedding_size: 128        # 保持 128 维，为了与 LightGCN/SASRec 公平对比
# MF 模型结构很简单，只有 Embedding，没有 layer 配置

# ================= 训练参数 =================
# MF 计算非常快，显存占用极小
train_batch_size: 512
learner: adam
learning_rate: 0.001
epochs: 50
eval_step: 1
stopping_step: 10

# ⚠️ Windows 必须设为 0
worker: 0

# ================= 评估设置 =================
# ⚠️ 采用【随机划分 (Random Split)】
# 这样可以和 LightGCN/SGL 直接横向对比
eval_args:
    split: {'RS': [0.8, 0.1, 0.1]} # 80%训练, 10%验证, 10%测试
    group_by: user
    order: RO   # Random Ordering
    mode: full  # 全量排序

metrics: ['Recall', 'MRR', 'NDCG', 'Hit']
topk: [10]