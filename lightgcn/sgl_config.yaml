#
## SGL 的核心：自监督学习配置
## type: 'ED' (Edge Drop, 随机丢边), 'ND' (Node Drop), 'RW' (Random Walk)
#ssl_tau: 0.5      # 温度系数，控制对比学习的难度
#ssl_weight: 0.1   # 自监督损失的权重
#drop_ratio: 0.1   # 数据增强时丢弃边/点的比例
