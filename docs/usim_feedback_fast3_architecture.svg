<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-labelledby="title desc">
  <title id="title">FAST3 ContentDelta Overview</title>
  <desc id="desc">Top-conference-style overview of USIM-Feedback FAST3 ContentDelta. Arrowheads are drawn manually as polygons.</desc>
  <defs>
    <style>
      text { font-family: "Times New Roman", Times, serif; fill: #111111; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .head { font-size: 20px; font-weight: 700; }
      .subhead { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; fill: #334155; }
      .eq { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #334155; }
      .dash { fill: #ffffff; stroke: #111111; stroke-width: 1.8; stroke-dasharray: 10 7; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.7; }
      .soft { fill: #f8fafc; stroke: #475569; stroke-width: 1.25; }
      .blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.55; }
      .orange { fill: #fed7aa; stroke: #f97316; stroke-width: 1.45; }
      .green { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1.45; }
      .redText { fill: #ef4444; font-weight: 700; }
      .line { stroke: #111111; stroke-width: 1.9; fill: none; }
      .thin { stroke: #111111; stroke-width: 1.25; fill: none; }
      .blueLine { stroke: #2563eb; stroke-width: 2; fill: none; }
      .dashLine { stroke: #2563eb; stroke-width: 1.65; stroke-dasharray: 6 5; fill: none; }
      .arrowDark { fill: #111111; }
      .arrowBlue { fill: #2563eb; }
      .chip { fill: #fff7ed; stroke: #f97316; stroke-width: 1.25; }
      .stateFill { fill: #e0f2fe; stroke: #2563eb; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1500" height="780" fill="#ffffff"/>

  <!-- Left: feature and ContentDelta encoder -->
  <g transform="translate(58 78)">
    <rect x="0" y="0" width="58" height="190" rx="9" fill="#eeeeee" stroke="#6b7280" stroke-width="1.8"/>
    <rect x="10" y="14" width="38" height="24" rx="4" fill="#a3a3a3"/>
    <rect x="10" y="52" width="38" height="24" rx="4" fill="#b8b8b8"/>
    <rect x="10" y="90" width="38" height="24" rx="4" fill="#c7c7c7"/>
    <rect x="10" y="128" width="38" height="24" rx="4" fill="#b0b0b0"/>
    <text x="-4" y="222" class="small">Content</text>
    <text x="-3" y="242" class="small">Feature</text>
    <text x="-8" y="116" class="eq">c_i</text>
  </g>

  <g transform="translate(176 92)">
    <rect class="box" width="206" height="166" rx="9"/>
    <text x="28" y="30" class="subhead">ContentDelta</text>
    <text x="54" y="52" class="subhead">Encoder</text>
    <text x="18" y="84" class="eq">base = MLP(c_i)</text>
    <text x="18" y="108" class="eq">txt = norm(base + clip(delta_i))</text>
    <text x="18" y="132" class="eq">txt += w_llm * MLP(s_llm)</text>
    <text x="18" y="154" class="eq">h_0 = Gate(id_i, txt)</text>
  </g>

  <path class="line" d="M116 173 H176"/>
  <polygon class="arrowDark" points="176,173 166,168 166,178"/>

  <g transform="translate(416 94)">
    <rect class="stateFill" x="0" y="0" width="50" height="164" rx="10"/>
    <rect x="6" y="12" width="38" height="30" rx="5" fill="#2563eb" opacity="0.85"/>
    <rect x="6" y="50" width="38" height="30" rx="5" fill="#60a5fa" opacity="0.85"/>
    <rect x="6" y="88" width="38" height="30" rx="5" fill="#bfdbfe"/>
    <rect x="6" y="126" width="38" height="24" rx="5" fill="#93c5fd"/>
    <text x="-2" y="202" class="eq">h_t</text>
    <text x="-42" y="224" class="small">Initial state</text>
  </g>

  <path class="line" d="M382 176 H416"/>
  <polygon class="arrowDark" points="416,176 406,171 406,181"/>

  <!-- Main framework -->
  <rect class="dash" x="520" y="54" width="850" height="344"/>

  <!-- Exploration set construction -->
  <g transform="translate(552 94)">
    <rect class="dash" width="386" height="138"/>
    <text x="78" y="30" class="head">Exploration Set Construction</text>
    <g transform="translate(24 60)">
      <rect class="soft" width="96" height="54" rx="8"/>
      <text x="23" y="23" class="small">Top-M</text>
      <text x="14" y="43" class="small">Retrieval</text>
    </g>
    <g transform="translate(142 60)">
      <rect class="soft" width="106" height="54" rx="8"/>
      <text x="22" y="23" class="small">Course</text>
      <text x="13" y="43" class="small">Soft Rerank</text>
    </g>
    <g transform="translate(270 60)">
      <rect class="soft" width="92" height="54" rx="8"/>
      <text x="18" y="23" class="small">Sample</text>
      <text x="24" y="43" class="small">N Users</text>
    </g>
  </g>

  <!-- State transition function -->
  <g transform="translate(964 94)">
    <rect class="dash" width="372" height="138"/>
    <text x="78" y="30" class="head">State Transition Function</text>
    <g transform="translate(34 62)">
      <rect class="blue" width="88" height="50" rx="8"/>
      <text x="20" y="22" class="small">Adaptive</text>
      <text x="24" y="40" class="small">Mix</text>
    </g>
    <text x="150" y="98" font-family="Arial" font-size="36" class="redText">+</text>
    <g transform="translate(204 62)">
      <rect class="orange" width="118" height="50" rx="8"/>
      <text x="28" y="22" class="small">Gradient</text>
      <text x="34" y="40" class="small">Update</text>
    </g>
  </g>

  <!-- Action set -->
  <g transform="translate(552 260)">
    <rect class="box" width="386" height="50" rx="8"/>
    <text x="22" y="31" class="head">Action Set:</text>
    <circle class="chip" cx="154" cy="25" r="17"/>
    <text x="149" y="31" font-family="Arial" font-size="16" font-weight="700">1</text>
    <circle class="chip" cx="208" cy="25" r="17"/>
    <text x="203" y="31" font-family="Arial" font-size="16" font-weight="700">3</text>
    <circle class="chip" cx="262" cy="25" r="17"/>
    <text x="257" y="31" font-family="Arial" font-size="16" font-weight="700">5</text>
    <text x="304" y="31" class="head">...</text>
    <rect x="332" y="10" width="36" height="30" rx="5" fill="#f8fafc" stroke="#64748b"/>
    <text x="342" y="31" class="eq">T</text>
  </g>

  <!-- Agent -->
  <g transform="translate(552 336)">
    <rect class="box" width="560" height="50" rx="8"/>
    <text x="220" y="31" class="head">Actor-Critic Agent</text>
  </g>

  <!-- Final state -->
  <g transform="translate(1410 94)">
    <rect class="stateFill" x="0" y="0" width="50" height="164" rx="10"/>
    <rect x="6" y="12" width="38" height="30" rx="5" fill="#ef4444" opacity="0.76"/>
    <rect x="6" y="50" width="38" height="30" rx="5" fill="#f87171" opacity="0.72"/>
    <rect x="6" y="88" width="38" height="30" rx="5" fill="#fca5a5"/>
    <rect x="6" y="126" width="38" height="24" rx="5" fill="#fecaca"/>
    <text x="-8" y="202" class="eq">h_{t+1}</text>
  </g>

  <!-- Connections in upper framework -->
  <path class="line" d="M466 176 H520"/>
  <polygon class="arrowDark" points="520,176 510,171 510,181"/>
  <path class="line" d="M938 164 H964"/>
  <polygon class="arrowDark" points="964,164 954,159 954,169"/>
  <path class="line" d="M744 232 V260"/>
  <polygon class="arrowDark" points="744,260 739,250 749,250"/>
  <path class="line" d="M744 310 V336"/>
  <polygon class="arrowDark" points="744,336 739,326 749,326"/>
  <path class="line" d="M1112 361 H1190"/>
  <polygon class="arrowDark" points="1190,361 1180,356 1180,366"/>
  <circle class="chip" cx="1218" cy="361" r="18"/>
  <text x="1213" y="367" font-family="Arial" font-size="16" font-weight="700">a</text>
  <path class="line" d="M1236 361 H1286"/>
  <polygon class="arrowDark" points="1286,361 1276,356 1276,366"/>
  <path class="line" d="M1286 361 C1310 330 1318 258 1298 232"/>
  <polygon class="arrowDark" points="1298,232 1296,244 1306,240"/>
  <path class="line" d="M1336 164 H1410"/>
  <polygon class="arrowDark" points="1410,164 1400,159 1400,169"/>

  <!-- Reward framework -->
  <rect class="dash" x="250" y="438" width="1120" height="214"/>
  <text x="704" y="472" class="head">Reward Function</text>

  <!-- Alignment reward -->
  <g transform="translate(290 500)">
    <rect class="soft" width="326" height="110" rx="18"/>
    <text x="82" y="28" class="subhead">Alignment Reward</text>
    <circle cx="82" cy="70" r="32" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <circle class="blue" cx="68" cy="78" r="8"/>
    <circle class="green" cx="94" cy="54" r="8"/>
    <line x1="68" y1="78" x2="94" y2="54" stroke="#ef4444" stroke-width="2.6"/>
    <text x="46" y="102" class="eq">h_t</text>
    <path class="thin" d="M122 70 H170"/>
    <polygon class="arrowDark" points="170,70 160,65 160,75"/>
    <circle cx="226" cy="70" r="32" fill="#ffffff" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4"/>
    <circle class="blue" cx="218" cy="73" r="8"/>
    <circle class="green" cx="240" cy="70" r="8"/>
    <line x1="218" y1="73" x2="240" y2="70" stroke="#ef4444" stroke-width="2.6"/>
    <text x="198" y="102" class="eq">h_next</text>
    <text x="268" y="65" class="eq">-D</text>
    <text x="268" y="84" class="eq">+gain</text>
  </g>

  <text x="636" y="565" class="head">+</text>

  <!-- Course reward -->
  <g transform="translate(676 500)">
    <rect class="soft" width="360" height="110" rx="18"/>
    <text x="78" y="28" class="subhead">Course-aware Reward</text>
    <g transform="translate(34 50)">
      <circle class="blue" cx="20" cy="24" r="10"/>
      <text x="42" y="13" class="eq">+ concept</text>
      <text x="42" y="35" class="eq">- prereq gap</text>
      <text x="190" y="13" class="eq">- difficulty</text>
      <text x="190" y="35" class="eq">- redundancy</text>
    </g>
  </g>

  <text x="1056" y="565" class="head">+</text>

  <!-- PPO and losses -->
  <g transform="translate(1094 500)">
    <rect class="soft" width="238" height="110" rx="18"/>
    <text x="46" y="28" class="subhead">Stable PPO + Losses</text>
    <text x="30" y="56" class="eq">GAE, adv norm, value clip</text>
    <text x="30" y="78" class="eq">InfoNCE + ID-content</text>
    <text x="30" y="100" class="eq">Prereq aux + delta reg</text>
  </g>

  <!-- Reward connections -->
  <path class="line" d="M744 386 C690 416 650 456 616 500"/>
  <polygon class="arrowDark" points="616,500 626,495 625,506"/>
  <path class="line" d="M1218 379 C1190 430 1118 448 1036 530"/>
  <polygon class="arrowDark" points="1036,530 1047,526 1043,536"/>
  <path class="line" d="M1435 258 C1454 352 1412 438 1332 542"/>
  <polygon class="arrowDark" points="1332,542 1343,538 1339,549"/>
  <path class="dashLine" d="M1410 224 C1290 422 610 424 416 258"/>
  <polygon class="arrowBlue" points="416,258 427,260 423,250"/>

  <!-- Objective note -->
  <g transform="translate(420 688)">
    <rect class="box" width="700" height="46" rx="8"/>
    <text x="36" y="30" class="small">Streaming protocol: train window, cold/hot grouping, sampled ranking and full ranking</text>
  </g>

  <text x="54" y="760" class="small">
    Figure. Overview of FAST3 ContentDelta: bounded content deltas refine course features, course-aware exploration selects imagined users, and sequential feedback updates item states under alignment, course-structure, PPO, and auxiliary losses.
  </text>
</svg>
